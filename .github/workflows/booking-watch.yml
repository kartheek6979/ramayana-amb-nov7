name: booking-watch

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ALLU watcher
        id: poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python allu_poller.py
      - name: Persist ALLU state
        if: ${{ always() && steps.poller.outcome != 'skipped' }}
        run: |
          if [[ -n "$(git status --porcelain allu_state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add allu_state.json
            git commit -m "chore: update ALLU shows [skip ci]"
            git push
          else
            echo "No ALLU state change."
          fi
